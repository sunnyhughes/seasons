  <style>
    /* General Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Lato', sans-serif;
  line-height: 1.6;
  color: #333;
}

/* Header Styling */
header {
    background-color: #f4d8e2;
    text-align: center;
    padding: 1rem 0;
}

header h1  {
    color: rgb(214, 179, 4);
    margin: 0;
    font-size: 2rem;
}

.topnav {
    position: sticky;
    top: 0;
    width: 100%;
    background-color: #d5e3f0;
    overflow: hidden;
    z-index: 1000;
}

.topnav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    gap: 1.5rem;
}
  
.topnav ul li {    
    padding: 10px; 
}
    
.topnav ul li a {
    text-decoration: none;
    color: #333 ;
}

.topnav ul li a:hover {
      color: rgb(187, 133, 133);
}

.topnav .icon {
  display: none;
}

/* Gallery Layout */
.gallery-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  padding: 20px;
}

.gallery {
  position: relative;
  width: 100%;
  max-width: 800px;
  overflow: hidden;
  border: 2px solid #ccc;
  background: white;
  margin-bottom: 20px;
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
}

/* Manual Slide Controls */
.manual-controls {
  display: flex;
  justify-content: space-between;
  position: absolute;
  top: 50%;
  width: 100%;
  transform: translateY(-50%);
}

.manual-controls button {
  background: rgba(0, 0, 0, 0.5);
  color: white;
  border: none;
  padding: 10px 20px;
  cursor: pointer;
}

.manual-controls button:hover {
  background: rgba(0, 0, 0, 0.8);
}

/* Auto Fade Gallery */
.fade-gallery {
  position: relative;
  width: 100%;
  max-width: 800px;
  margin: auto;
  overflow: hidden;
}

.fade-gallery img {
  position: absolute;
  width: 100%;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}

.fade-gallery img.active {
  opacity: 1;
}

/* Auto Gallery Controls */
.auto-controls {
  text-align: center;
  margin-top: 10px;
}

.auto-controls button {
  background: purple;
  color: white;
  border: none;
  padding: 10px 15px;
  cursor: pointer;
}

.auto-controls button:hover {
  background: gold;
  color: black;
}

/* Responsive Adjustments */
@media (max-width: 768px) {
  .topnav ul {
    flex-direction: column;
    align-items: center;
  }
}

  </style>
</head>
